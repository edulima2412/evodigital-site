<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo escuro para melhor contraste -->
  <rect width="200" height="200" fill="#0a0a0f" rx="40"/>
  
  <!-- E letter - mais ousado e visível -->
  <g transform="translate(40, 50)">
    <!-- Top bar - mais espesso -->
    <rect x="0" y="0" width="70" height="20" rx="10" fill="url(#favGradient)" />
    <!-- Middle bar -->
    <rect x="0" y="40" width="60" height="20" rx="10" fill="url(#favGradient)" />
    <!-- Bottom bar -->
    <rect x="0" y="80" width="70" height="20" rx="10" fill="url(#favGradient)" />
  </g>
  
  <!-- Destaque de brilho no canto superior -->
  <circle cx="150" cy="50" r="25" fill="#00D4FF" opacity="0.3"/>
</svg>