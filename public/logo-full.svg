<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9D4EDD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon E -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="url(#logoBrand)" />
    <rect x="0" y="40" width="65" height="20" rx="10" fill="url(#logoBrand)" />
    <rect x="0" y="80" width="80" height="20" rx="10" fill="url(#logoBrand)" />
  </g>
  
  <!-- Text: EvoDigital -->
  <text x="270" y="160" font-family="Inter, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-2">EvoDigital</text>
  
  <!-- Tagline -->
  <text x="270" y="195" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#0099FF" letter-spacing="3">TECNOLOGIA QUE IMPULSIONA NEGÓCIOS</text>
</svg>